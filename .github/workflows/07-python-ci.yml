# WORKFLOW 07 - Python CI with pytest (beginner)
# Purpose: install Python dependencies and run tests (works for FastAPI etc.).

name: 07 Python CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # Quote it so YAML does not read 3.10 as 3.1
          cache: pip               # Cache pip downloads between runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip      # Update pip itself
          pip install -r requirements.txt          # Project dependencies
          pip install pytest                       # Test runner

      - name: Run tests
        run: pytest -v             # -v = verbose output
